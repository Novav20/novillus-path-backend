services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sourceguild-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlvolume:/var/opt/mssql

volumes:
  sqlvolume: